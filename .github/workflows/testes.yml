name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 291 regras de negócio
        run: python3 teste_regras.py

      - name: teste por mutação (14/15 bugs detectados)
        run: python3 qa_mutacao.py

      - name: modo demonstração de ponta a ponta
        run: python3 demo.py --reiniciar
